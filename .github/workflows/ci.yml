name: CI

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version-file: uv.lock
          python-version: '3.13'
          enable-cache: false
      - name: Install locked build tools
        run: uv sync --locked --only-group build --only-group release --no-install-project
      - name: Check version tag matches package version
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          uv run --no-sync python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version']
          if os.environ['RELEASE_TAG'] != f'v{version}':
              raise ValueError(f'expected release tag v{version}')
          PY
      - name: Build wheel from source distribution with locked backend
        run: uv build --no-build-isolation
      - name: Validate package metadata
        run: uv run --no-sync twine check --strict dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

  test:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.12', '3.13', '3.14', '3.15', '3.14t', '3.15t']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version-file: uv.lock
          python-version: ${{ matrix.python }}
          enable-cache: false
      - name: Require the GIL to be disabled on free-threaded builds
        if: endsWith(matrix.python, 't')
        run: |
          echo 'PYTHON_GIL=0' >> "$GITHUB_ENV"
          echo 'LAZY_IMPORTER_TEST_FREE_THREADED=1' >> "$GITHUB_ENV"
      - name: Install locked test dependencies
        run: uv sync --locked --only-group test --no-install-project
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distributions
          path: dist
      - name: Install the built wheel without resolving dependencies
        run: uv pip install --no-deps --no-index dist/*.whl
      - name: Test the installed wheel
        run: uv run --no-sync pytest

  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version-file: uv.lock
          python-version: '3.13'
          enable-cache: false
      - name: Install locked lint tools
        run: uv sync --locked --only-group lint --no-install-project
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync pyrefly check
      - run: uv run --no-sync zizmor --offline .github/workflows
