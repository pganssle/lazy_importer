[build-system]
requires = ["flit_core>=3.12,<5"]
build-backend = "flit_core.buildapi"

[project]
name = "lazy-importer"
version = "0.1.0"
description = "A context manager for portable, opt-in lazy imports"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]

[dependency-groups]
test = ["pytest>=8", "pytest-cov>=6", "coverage>=7.16"]
lint = ["ruff", "pyrefly", "zizmor"]
build = ["flit_core>=3.12,<5"]
release = ["twine"]
tooling = ["tox>=4", "tox-uv", "uv"]

[tool.flit.sdist]
include = ["tests/", "tox.ini", "CONTRIBUTING.md", "uv.lock", ".github/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyrefly]
preset = "strict"
project-includes = ["src"]
python-version = "3.11"


[tool.coverage.run]
source = ["lazy_importer"]
branch = true
patch = ["subprocess"]

[tool.coverage.report]
show_missing = true
