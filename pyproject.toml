[build-system]
requires = ["flit_core>=3.12,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "lazy-importer"
version = "0.1.0"
description = "A context manager for portable, opt-in lazy imports"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]

[dependency-groups]
test = ["pytest>=8", "pytest-cov>=6", "coverage>=7.16"]
lint = ["ruff", "mypy"]

[tool.flit.sdist]
include = ["tests/", "tox.ini", "CONTRIBUTING.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true


[tool.coverage.run]
source = ["lazy_importer"]
branch = true
patch = ["subprocess"]

[tool.coverage.report]
show_missing = true
