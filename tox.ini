[tox]
env_list = py311, py312, py313, py314, py315, py314t, py315t, lint

[testenv]
package = wheel
dependency_groups = test
commands = pytest {posargs}

[testenv:lint]
dependency_groups = lint
commands =
    ruff check .
    ruff format --check .
    mypy src

[testenv:py314t]
base_python = python3.14t
set_env =
    PYTHON_GIL = 0
    LAZY_IMPORTER_TEST_FREE_THREADED = 1

[testenv:py315t]
base_python = python3.15t
set_env =
    PYTHON_GIL = 0
    LAZY_IMPORTER_TEST_FREE_THREADED = 1
