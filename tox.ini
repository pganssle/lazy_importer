[tox]
env_list = py311, py312, py313, py314, py315, py314t, py315t, lint

[testenv]
package = skip
allowlist_externals = uv
set_env = UV_PROJECT_ENVIRONMENT = {envdir}
commands_pre =
    uv sync --locked --python {envpython} --only-group test --only-group build --no-install-project
    uv pip install --python {envpython} --no-deps --no-build-isolation .
commands = pytest {posargs}

[testenv:lint]
commands_pre = uv sync --locked --python {envpython} --only-group lint --no-install-project
commands =
    ruff check .
    ruff format --check .
    pyrefly check
    zizmor --offline .github/workflows

[testenv:py314t]
base_python = python3.14t
set_env =
    {[testenv]set_env}
    PYTHON_GIL = 0
    LAZY_IMPORTER_TEST_FREE_THREADED = 1

[testenv:py315t]
base_python = python3.15t
set_env =
    {[testenv]set_env}
    PYTHON_GIL = 0
    LAZY_IMPORTER_TEST_FREE_THREADED = 1
